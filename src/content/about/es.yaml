intro: >
  Soy Alberto Arana — Ingeniero de Software Principal y especialista en frontend con base sólida en backend.
  Mi enfoque está orientado a producto: construyo interfaces pulidas y las APIs, herramientas y arquitectura
  que hacen usables los productos geoespaciales para clientes reales. Disfruto las partes poco glamurosas
  de la ingeniería — límites claros, menos complejidad accidental y dejar el código más calmado de lo que lo encontré.
focus:
  - title: Entrega orientada a producto
    summary: Partir del usuario y del outcome de negocio — entregar apps geoespaciales que resuelven un problema concreto del cliente, no plataformas abstractas por sí mismas.
  - title: Apps geoespaciales de cliente
    summary: Aplicaciones React/TypeScript encima de CARTO — mapas, flujos y UX adaptados a cada engagement enterprise.
  - title: Librerías compartidas y arquitectura
    summary: Paquetes reutilizables, límites de módulos y design systems que mantienen la entrega de Professional Services rápida y consistente.
  - title: Tipado de punta a punta
    summary: TypeScript estricto, tipos expresivos y contratos que detectan errores antes del runtime.
  - title: Developer experience
    summary: Tooling, convenciones y docs que hacen que lo correcto sea lo fácil en cada engagement.
principles:
  - title: Claridad sobre ingenio
    summary: El código se lee mucho más de lo que se escribe; optimizo para quien lee.
  - title: Pasos pequeños y reversibles
    summary: Entregar en slices finos, build en verde, aprender rápido.
  - title: Accesibilidad y rendimiento son features
    summary: No son afterthoughts — este sitio apunta a 100/100 en ambos.
  - title: Precisión serena
    summary: Decisiones medidas, trade-offs honestos y cero drama en el pipeline.
