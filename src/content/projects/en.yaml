featured:
  - slug: carto-frontend-platform
    title: CARTO Frontend Platform
    summary: Tech leadership for the Agentic GIS frontend — React/TypeScript at geospatial scale.
    problem: >
      Enterprise spatial analytics needs a frontend platform that stays fast under map-heavy workloads,
      coherent across product surfaces, and shippable by multiple teams without constant merge pain.
    approach: >
      Set technical direction for CARTO's React/TypeScript platform, drove design-system adoption,
      clarified ownership boundaries, and mentored senior engineers while keeping release quality high.
    challenge: >
      Balancing WebGL/map performance with product velocity, Series C growth, and platform consistency
      across geospatial features that never leave the customer's cloud.
    outcome: >
      Sustained frontend leadership through Lead and Principal roles — platform patterns still used
      across spatial analytics products, with design-system and architecture standards adopted org-wide.
    differently: >
      Would invest earlier in measurable performance budgets and published internal packages to reduce
      duplication across product surfaces.
    stack: [React, TypeScript, WebGL, Design Systems]
    tags: [Geospatial, Platform, Tech Lead]
    demoUrl: https://carto.com
    repoUrl: null
  - slug: oss-parameter-libs
    title: Parameter encode / decode libraries
    summary: Small, focused open-source utilities for transforming data into URL-safe parameter formats.
    problem: >
      Client apps repeatedly needed reliable encoding/decoding of structured parameters for URLs and
      APIs — without pulling in heavy dependencies.
    approach: >
      Published focused JavaScript packages (`encoder-parameters`, `decoder-parameters`) with clear APIs,
      minimal surface area, and README-first documentation for reuse across projects.
    challenge: >
      Keeping the API tiny while covering real-world edge cases, and making the libraries easy to adopt
      without ceremony.
    outcome: >
      Public packages on GitHub that demonstrate library authoring craft — clear contracts, small scope,
      and reusable utilities beyond a single product codebase.
    stack: [JavaScript, Node.js, OSS]
    tags: [Library Authoring, DX, Open Source]
    demoUrl: null
    repoUrl: https://github.com/aaranadev/encoder-parameters
  - slug: aarana-dev
    title: aarana.dev
    summary: This site — a static, bilingual portfolio built as a production-quality product MVP.
    problem: >
      Need a single URL that converts recruiter scan-time into conversation — with evidence of craft,
      career narrative, and contact paths — not a template dump.
    approach: >
      Astro 7 static site, content collections per locale, Tailwind v4 design tokens, terminal/IDE
      aesthetic, Person JSON-LD, hreflang, and accessibility-first interactions (theme, mobile dialog).
    challenge: >
      Balancing a distinctive developer aesthetic with clarity for non-technical recruiters, while
      keeping Lighthouse scores near 100 and shipping EN/ES in parallel.
    outcome: >
      Fully static bilingual site with strong SEO/a11y/performance baselines — the portfolio itself is
      a working sample of platform thinking and product polish.
    differently: >
      Would add deeper CASE metrics earlier and surface a downloadable CV from day one.
    stack: [Astro, TypeScript, Tailwind CSS, Vercel]
    tags: [Portfolio, i18n, Accessibility, Performance]
    demoUrl: https://aarana.dev
    repoUrl: https://github.com/aaranadev/aaranadev
