featured:
  - slug: carto-professional-services
    title: CARTO Professional Services
    summary: Apps de cliente y consultoría sobre CARTO — no la plataforma core del producto. Actualmente liderando el producto Site Selection.
    context: >
      Location intelligence para clientes enterprise — apps de analítica y decisión geoespacial en
      industrias anonimizadas (retail, logística y adyacentes). Sin demos públicas a propósito.
    problem: >
      Los clientes de CARTO necesitan aplicaciones geoespaciales de producción adaptadas a sus datos,
      flujos y restricciones cloud — a menudo con plazos ajustados y madurez de equipo desigual.
    approach: >
      Como tech lead en Professional Services, diseño y entrego aplicaciones React/TypeScript encima de
      CARTO con un equipo de 5+ ingenieros, lidero consultoría técnica y actualmente la dirección técnica
      del producto Site Selection — traduciendo capacidades de CARTO en UX lista para cliente.
    challenge: >
      Entregar apps fiables con mapas en stacks enterprise diversos manteniendo calidad, mentoría y
      alineación con las APIs de CARTO sin ser owner de la plataforma core.
    outcome: >
      20+ apps geoespaciales de cliente en producción; Site Selection liderado como producto en
      producción; patrones frontend reutilizables y playbooks de consultoría que mantienen rápida la
      entrega de PS mientras la plataforma core de CARTO sigue en el org de producto.
    differently: >
      Formalizaría antes el tooling compartido de PS para que cada engagement parta de la misma base probada.
    stack: [React, TypeScript, DeckGL, Geoespacial]
    tags: [Professional Services, Site Selection, Apps de Cliente, Tech Lead]
    demoUrl: null
    repoUrl: null
  - slug: carto-ps-lib
    title: carto-ps-lib
    summary: CARTO Professional Services Library — mapas, widgets, layers, edición de geometrías, servicios y tooling en un monorepo para delivery de PS.
    context: >
      Repo GitHub privado hoy (acceso de equipo) — release open-source previsto pronto. El enlace apunta
      al repositorio existente en la org de CARTO.
    problem: >
      Los engagements de Professional Services reconstruían una y otra vez la misma UI de mapas, widgets,
      layers, edición de geometrías, helpers HTTP y configs de calidad — ralentizando la entrega y
      desviándose de un estilo CARTO consistente.
    approach: >
      Monorepo Turbo que centraliza los building blocks de PS: mapas React con DeckGL (`@carto/ps-react-maps`),
      React UI/widgets (`@carto/ps-react-ui`), layers, edición de geometrías, servicios HTTP/datos, utils
      compartidas y style-guide (ESLint, Prettier, TypeScript) — con Storybook, docs generadas y scaffolding
      AI orientado a tickets para generar POCs desde los mismos primitivos gestionados.
    challenge: >
      Diseñar límites de paquetes útiles en muchos proyectos de cliente, mantener coherente el stack
      React / DeckGL, habilitar generación de POCs asistida por AI a partir de tickets, y preparar una
      librería privada para un open-source cercano.
    outcome: >
      Adoptada en la entrega de PS — ~80% menos tiempo para levantar POCs componiendo mapas, widgets,
      layers y edición de geometrías desde la lib en lugar de reconstruir; generación asistida por AI
      desde tickets sobre esos primitivos; camino más claro a docs y versionado OSS públicos.
    differently: >
      Publicaría antes el camino a open-source con versionado más claro y docs de adopción para
      contribuidores externos.
    stack: [React, TypeScript, DeckGL, Vite, Turbo, Storybook]
    tags: [Autoría de Librerías, Monorepo, Geoespacial, AI DX]
    demoUrl: null
    repoUrl: https://github.com/CartoDB/carto-ps-lib
  - slug: aarana-dev
    title: aarana.dev
    summary: Este sitio — portfolio estático bilingüe construido como un MVP de producto listo para producción.
    context: >
      Case study terciario — muestra de craft y shipping, no la evidencia principal de hiring. La evidencia
      principal está en los cases de CARTO PS y carto-ps-lib de arriba.
    problem: >
      Hace falta una URL única que convierta el escaneo de un recruiter en conversación — con evidencia
      de craft, narrativa de carrera y vías de contacto — no un dump de plantilla.
    approach: >
      Sitio estático Astro 7, content collections por locale, tokens Tailwind v4, estética terminal/IDE,
      Person JSON-LD, hreflang e interacciones accessibility-first (tema, dialog móvil).
    challenge: >
      Equilibrar una estética developer distintiva con claridad para recruiters no técnicos, manteniendo
      Lighthouse cerca de 100 y entregando EN/ES en paralelo.
    outcome: >
      Sitio bilingüe 100% estático con bases sólidas de SEO/a11y/rendimiento — el portfolio es en sí
      una muestra de pulido de producto y arquitectura content-driven.
    differently: >
      Mantendría las narrativas CASE más centradas en Professional Services desde el día uno y reservaría
      este sitio como muestra terciaria de craft.
    stack: [Astro, TypeScript, Tailwind CSS, Vercel]
    tags: [Portfolio, i18n, Accesibilidad, Rendimiento]
    demoUrl: https://aarana.dev
    repoUrl: https://github.com/aaranadev/aaranadev
